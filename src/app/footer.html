<div class="footer-separator"></div>
<footer class="footer">
  <div>
    <p class="icons">
      <span class="accent-color-control">
        <button
          class="theme-toggle"
          type="button"
          (click)="onToggleAccentColor()"
          title="Alege culoarea de accent personalizată"
          aria-label="Alege culoarea de accent personalizată"
          aria-controls="accentColorInput"
        >
          <fa-icon [icon]="faPaintBrush"></fa-icon>
        </button>
        <input
          (input)="onChangeAccentColor($event)"
          type="color"
          id="accentColorInput"
          name="accentColorInput"
          [value]="accentColor"
          aria-label="Accent color"
        />
      </span>
      <button
        class="theme-toggle"
        type="button"
        (click)="onToggleDarkTheme()"
        title="Comută între tema clară/întunecată"
        aria-label="Comută între tema clară și cea închisă"
      >
        <fa-icon [icon]="faMoon"></fa-icon>
      </button>
      <a
        target="_blank"
        rel="noopener noreferrer"
        href="https://github.com/radualexandrub/Planificator-Concediu-Zile-Libere-2027"
        aria-label="Vezi codul sursă pe GitHub"
      >
        <fa-icon [icon]="faGithub" title="Vezi codul sursă pe GitHub"></fa-icon>
      </a>
    </p>
    <p>Creat cu <a target="_blank" rel="noopener noreferrer" href="https://angular.dev">Angular</a> 
      & <a target="_blank" rel="noopener noreferrer" href="https://nodejs.org">Node.js</a></p>
    <p>Copyright 2026 &copy; <a target="_blank" rel="noopener noreferrer" href="https://radubulai.com">Radu-Alexandru B.</a></p>
  </div>
</footer>
